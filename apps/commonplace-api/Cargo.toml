[package]
name = "commonplace-api"
version = "0.1.0"
edition = "2021"
description = "CommonPlace interoperability API seam (plan unit F3): a typed consumer GraphQL profile over the CommonPlace object model, gated by per-instance API keys. The universal connection point so any front end or self-hosted instance talks to the database with one API."
license = "MIT"
rust-version = "1.85"

# Own Cargo root (bare [workspace]) so the pinned Theorem/RustyRed substrate
# graph stays isolated from the CommonPlace root workspace.
[workspace]

[dependencies]
commonplace = { path = "../../crates/commonplace" }
rustyred-thg-core = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
rustyred-thg-find = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
# saveUrl fetches through `web_consume_to_graph` in-process, so the page graph
# and the filed item land in one store under one lock (SPEC B7).
rustyred-web = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
theorem-harness-core = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
theorem-harness-runtime = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
async-graphql = "7"
async-graphql-axum = "7"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
yrs = "0.27.2"
# Block attestation signing (HANDOFF-PUBLISH FD-P1): per-tenant Ed25519 over the
# block content identity. Secret bytes handled through Zeroizing; hex for wire.
ed25519-dalek = "2"
hex = "0.4"
zeroize = "1"
