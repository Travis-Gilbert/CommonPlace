[package]
name = "theoremweb-agent-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Complete Rust UI-message runtime for TheoremWeb agent surfaces"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
dioxus-ssr = "0.7.10"
proptest = "1"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

