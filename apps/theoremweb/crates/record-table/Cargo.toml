[package]
name = "theoremweb-record-table"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runtime SchemaVersion record table for TheoremWeb"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
theoremweb-chrome = { path = "../chrome" }
thiserror = "2.0"

[dev-dependencies]
dioxus-ssr = "0.7.10"

[workspace]

[lints.rust]
unsafe_code = "forbid"
