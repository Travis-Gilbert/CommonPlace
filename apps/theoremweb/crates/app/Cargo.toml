[package]
name = "theoremweb-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Registry-driven TheoremWeb shell and intent state machine"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
theoremweb-chrome = { path = "../chrome" }
theoremweb-navigation = { path = "../navigation" }
theoremweb-record-table = { path = "../record-table" }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

