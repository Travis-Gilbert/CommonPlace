[package]
name = "theoremweb-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Graph-backed scope-polymorphic layout renderer for TheoremWeb"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
dioxus-dnd = "=3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
dioxus-ssr = "0.7.10"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
