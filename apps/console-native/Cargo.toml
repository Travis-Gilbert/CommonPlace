[package]
name = "commonplace-console-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pinned GPUI operator console for CommonPlace data transparency."
license = "MIT"
publish = false

[workspace]
resolver = "2"

[package.metadata.console-pins]
gpui-component-version = "0.5.1"
gpui-component-commit = "0f0ab35233212f8f3277028995caf0c41e13ee6c"
gpui-version = "0.2.2"
gpui-commit = "69e2130295c2649963eb639fc70b4f2ee8ea1624"

[dependencies]
anyhow = "1"
commonplace-console-core = { path = "../../crates/console-core" }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "0f0ab35233212f8f3277028995caf0c41e13ee6c" }
rust-embed = { version = "=8.12.0", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "69e2130295c2649963eb639fc70b4f2ee8ea1624" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
