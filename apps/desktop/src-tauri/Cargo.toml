[package]
name = "desktop"
version = "0.1.0"
description = "CommonPlace desktop shell"
authors = ["Travis Gilbert"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
theorem-pet = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
commonplace-desktop-runtime = { path = "../../../crates/commonplace-desktop-runtime" }
serde_json = "1"
# kokoro-en enables both Core ML and CUDA in its default feature set. macOS
# prebuilt ONNX Runtime archives provide Core ML only, so accept that best-fit
# archive instead of requiring the irrelevant CUDA execution provider.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["lax-feature-matching"] }
# Keep the isolated app workspace on the coherent Rama API expected by the
# pinned Codex network-proxy graph pulled in through the native runtime.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

[patch.crates-io]
# The app is its own Cargo workspace, so it must mirror the native runtime's
# pinned Codex sandbox websocket forks rather than resolving crates.io builds
# that do not expose the required `proxy` features.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
