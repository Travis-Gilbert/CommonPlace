[package]
name = "commonplace"
# 0.1.1 (not 0.1.0) to disambiguate from the substrate's own `commonplace` v0.1.0
# crate in the shared lockfile once commonplace-api pulls the Theorem harness crates.
version = "0.1.1"
edition = "2021"
description = "CommonPlace consumer object model (Item/Collection/Tag) and auto-structuring ingest, graph-native over the RustyRedCore-THG substrate."
license = "MIT"
rust-version = "1.85"

# Own Cargo root so this product crate keeps its pinned substrate graph isolated
# from the root workspace.
[workspace]

[dependencies]
rustyred-thg-core = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
rustyred-thg-reconstruct-fact = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b02a09efc9a03622f57cb515dd7ffd621f7bc426" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1"
