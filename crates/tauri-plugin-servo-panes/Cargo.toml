[package]
name = "tauri-plugin-servo-panes"
version = "0.1.0"
edition = "2021"
description = "SPEC-COMMONPLACE-BROWSER-SHELL B2 (chrome half): spawns and supervises the pane-host sidecar, exposes the pane_* commands, and forwards pane:// events."
license = "MIT"
publish = false

# Its own workspace, for the same reason `pane-host` has one: Tauri's build
# graph does not belong in every root-level `cargo test`.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
pane-protocol = { path = "../pane-protocol" }
# For the session graph only. This pulls no Servo: `pane-host` is the
# Servo-FREE half, and the chrome links it so both sides write the same nodes.
pane-host = { path = "../pane-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[dev-dependencies]
# `mock_app` gives the supervisor an `AppHandle` to emit through without a real
# window, which is what lets the restart path be tested at all.
tauri = { version = "2", features = ["test"] }
