[package]
name = "pane-host-servo"
version = "0.1.0"
edition = "2021"
description = "SPEC-COMMONPLACE-BROWSER-SHELL B2: the `pane-host` sidecar binary — the only place CommonPlace links Servo."
license = "MIT"
publish = false

# Its own workspace: this build graph contains libservo, which needs Servo's
# pinned toolchain and `mach bootstrap` system dependencies. Nothing else in
# CommonPlace should pay that to run its tests.
[workspace]

# The chrome spawns a sidecar called `pane-host`; the package is named for what
# it links so nobody mistakes it for the testable half.
[[bin]]
name = "pane-host"
path = "src/main.rs"

[dependencies]
# All the logic. This crate is the mapping layer and nothing else, which is why
# it has no tests: everything worth asserting lives one crate over, where it can
# be run without a Servo build.
pane-host = { path = "../pane-host" }
pane-protocol = { path = "../pane-protocol" }
# SPEC-THEOREM-BUILD-GRAPH-1.0 BG1: this crate is the from-source escape hatch.
# Default CommonPlace GPUI builds do NOT compile it — they fetch a pinned
# `pane-host` binary via `scripts/fetch-pane-host.sh`.
#
# Build from source (engine-hacking days):
#   cargo build --manifest-path crates/pane-host-servo/Cargo.toml --features servo-from-source
# Optionally patch browser-embed to a local Theorem checkout:
#   [patch."https://github.com/Travis-Gilbert/Theorem.git"]
#   browser-embed = { path = "../Theorem/apps/browser/crates/browser-embed" }
#
# Cargo discovers the package in Theorem's nested apps/browser workspace.
browser-embed = { git = "https://github.com/Travis-Gilbert/Theorem.git", rev = "b634e3fc71acbf04e749ca38534c68a441c97aa7" }
raw-window-handle = "0.6"

[features]
default = ["servo-from-source"]
# Named so CI and docs can require the hatch explicitly. Always on when this
# crate is built; the cut edge is that browser-native never builds this crate
# on the default path.
servo-from-source = []
