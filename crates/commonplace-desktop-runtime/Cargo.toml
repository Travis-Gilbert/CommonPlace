[package]
name = "commonplace-desktop-runtime"
version = "0.1.0"
edition = "2021"
description = "Native CommonPlace desktop runtime: local RustyRed node, CommonPlace API, receiver, browser commands, and provider seams."
license = "MIT"
rust-version = "1.85"

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
theorem-receiver = { path = "../../../Theorem/rustyredcore_THG/crates/theorem-receiver" }
rustyred-thg-server = { path = "../../../Theorem/rustyredcore_THG/crates/rustyred-thg-server" }
theorem-pet = { path = "../../../Theorem/apps/theorem-pet/src-tauri" }
commonplace-api = { path = "../../apps/commonplace-api" }
commonplace = { path = "../commonplace" }
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
# The Rama alpha crates accept Cargo's later stable 0.3.0 support releases, but
# those releases changed APIs still imported/generated by the alpha graph.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

[patch.crates-io]
# The pinned Codex sandbox graph requests the `proxy` features carried by these
# forks. This standalone workspace does not inherit Theorem's root patch table,
# so keep the revisions byte-for-byte aligned with rustyredcore_THG.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
