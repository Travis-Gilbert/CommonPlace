[package]
name = "commonplace-console-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Realm-neutral query, formatting, diff, watch, and graph simulation core for CommonPlace consoles."
license = "MIT"

# This crate is intentionally independent from the repository root workspace.
# It must remain buildable without the RustyRed store or either UI realm.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Reserved for a future shared-device adapter. Until that seam exists, enabling
# this feature keeps the same CPU result and reports an explicit fallback.
gpu = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
