# Railway deploy config for the CommonPlace fork Express service.
# Configure this as a second service from the repository root.

[build]
builder = "RAILPACK"
buildCommand = "npm --prefix server ci && npm --prefix server run prisma:generate"
watchPatterns = [
  "server/**",
  "railpack.json",
  "railway.server.toml"
]

[deploy]
startCommand = "npm --prefix server start"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
