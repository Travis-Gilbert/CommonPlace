# Railway deploy config for the canonical CommonPlace Console service when
# Railway builds from the repository root.

[build]
builder = "RAILPACK"
buildCommand = "npm run build:railway"
watchPatterns = [
  "apps/console/src/**",
  "apps/console/public/**",
  "apps/console/scripts/**",
  "apps/console/next.config.ts",
  "apps/console/package.json",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "packages/**",
  "railpack.json",
  "railway.toml"
]

[deploy]
startCommand = "node apps/console/scripts/start-railway.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
