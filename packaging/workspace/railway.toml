# Railway deploy config for the CommonPlace workspace service.
# SPEC-COMMONPLACE-OPENWORK-FORK-1.0 OW5.
#
# Deploy with this file explicitly:
#   railway up --config packaging/workspace/railway.toml
#
# The explicit --config matters. `railway up` from the repository root picks up
# the root railway.toml, which belongs to the legacy web service, and deploys
# that instead with no error (the same trap apps/console documents for
# railway.console.toml). Build context is the repository root because the image
# needs the pnpm workspace manifests.
#
# Required environment:
#   WORKSPACE_TOKEN   The one secret both doors authenticate against. The
#                     entrypoint refuses to start without it rather than
#                     exposing an unauthenticated IDE.
#
# Optional environment:
#   WORKSPACE_REPO_URL     Cloned into WORKSPACE_DIR on a fresh volume. Absent,
#                          the volume is initialized as an empty repository.
#   THEOREM_MCP_URL        The head's graph door (OW2). Absent, the head runs
#                          without the graph and says so.
#   THEOREM_API_KEY        Bearer credential for the above.
#   THEOREM_TENANT_ID      Tenant scope for the above.
# Deliberately NOT set here:
#   COMMONPLACE_ACTIVE_WORKSPACE_SECRET
#                          The console's cookie signing key is symmetric, so a
#                          container that runs user code and publishes a
#                          terminal could mint sessions for any tenant rather
#                          than merely verify its own. The entrypoint refuses to
#                          start if it finds this variable. The console
#                          authenticates the user at its own edge and reaches
#                          this service with WORKSPACE_TOKEN, which is already
#                          scoped to one workspace, so no sign-in is added.
#
# A volume must be mounted at /workspace. Without it the checkout lives in the
# container layer and every deploy silently discards the user's work, and so do
# the opencode session database and the daemon runtime state, which the image
# places under /workspace/state via XDG_DATA_HOME and XDG_CONFIG_HOME.

[build]
builder = "DOCKERFILE"
dockerfilePath = "packaging/workspace/Dockerfile"
watchPatterns = [
  "apps/chat-server/**",
  "apps/chat/**",
  "packages/openwork-ui/**",
  "packages/openwork-types/**",
  "packages/openwork-paths/**",
  "packaging/workspace/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
# The chat door is the service's public port; the IDE door is reached through
# the console's proxy on the same workspace, not published separately.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
