# Railway deploy config for the CommonPlace workspace service.
# SPEC-COMMONPLACE-OPENWORK-FORK-1.0 OW5.
#
# This service deploys from its GitHub source on push to main, not by upload.
# `railway up --config <path>` is written in older notes and no longer parses:
# the CLI dropped --config, and 5.30.4 answers with
#   error: unexpected argument '--config' found
# Uploading without it is worse than failing, because `railway up` from the
# repository root picks up the root railway.toml, which belongs to the legacy
# web service, and deploys that instead with no error (the same trap
# apps/console documents for railway.console.toml). Build context is the
# repository root because the image needs the pnpm workspace manifests.
#
# Required environment:
#   WORKSPACE_TOKEN   The one secret the chat door authenticates against. The
#                     entrypoint refuses to start without it rather than
#                     exposing an unauthenticated chat door.
#
# Optional environment (IDE substrate / theorem-vscode):
#   Co-located commonplace-api is built into the image when
#   INCLUDE_EDITOR_SUBSTRATE=1 (Dockerfile default). Entrypoint starts it on
#   :50090, bootstraps createProject(/workspace/repo), and exports
#   THEOREM_EDITOR_* for the pack. Railway env overrides still win when set.
#   THEOREM_ACP_WS_URL               hosted ACP websocket
#   THEOREM_ACP_TOKEN                bearer for ACP (may equal editor key)
#   THEOREM_CONSOLE_ORIGIN           deep links (default v2 console)
#
# Optional environment:
#   WORKSPACE_REPO_URL     Cloned into WORKSPACE_DIR on a fresh or sticky-empty
#                          volume. Absent, see WORKSPACE_REPO.
#   WORKSPACE_REPO         owner/name (e.g. Travis-Gilbert/CommonPlace). When
#                          WORKSPACE_REPO_URL is unset, composed with
#                          THEOREM_GIT_TOKEN into an HTTPS clone URL so the
#                          token is not duplicated into a second secret.
#   THEOREM_GIT_TOKEN      GitHub token used only when composing the clone URL.
#   THEOREM_MCP_URL        The head's graph door (OW2). Absent, the head runs
#                          without the graph and says so.
#   THEOREM_API_KEY        Bearer credential for the above.
#   THEOREM_TENANT_ID      Tenant scope for the above.
# Deliberately NOT set here:
#   COMMONPLACE_ACTIVE_WORKSPACE_SECRET
#                          The console's cookie signing key is symmetric, so a
#                          container that runs user code and publishes a
#                          terminal could mint sessions for any tenant rather
#                          than merely verify its own. The entrypoint refuses to
#                          start if it finds this variable. The console
#                          authenticates the user at its own edge and reaches
#                          this service with WORKSPACE_TOKEN, which is already
#                          scoped to one workspace, so no sign-in is added.
#
# A volume must be mounted at /workspace. Without it the checkout lives in the
# container layer and every deploy silently discards the user's work, and so do
# the opencode session database and the daemon runtime state, which the image
# places under /workspace/state via XDG_DATA_HOME and XDG_CONFIG_HOME.

[build]
builder = "DOCKERFILE"
dockerfilePath = "packaging/workspace/Dockerfile"
# One rule: every path the Dockerfile COPYs from the build context belongs
# here. A path the image is built from but nobody watches produces a SKIPPED
# deploy, which reads exactly like a successful no-op. Deploy 6ddb18cd was
# skipped for a commit that changed how the Studio server is built, because
# packaging/commonplace-studio was missing below while line 155 of the
# Dockerfile copies that whole directory into the studio-server stage.
watchPatterns = [
  "apps/chat-server/**",
  "apps/chat/**",
  "packages/openwork-ui/**",
  "packages/openwork-types/**",
  "packages/openwork-paths/**",
  "apps/theorem-vscode/**",
  "packages/theorem-acp/**",
  "packages/theorem-chat-register/**",
  "packages/block-view-contracts/**",
  "packaging/workspace/**",
  # The Studio fork pipeline: patch queue, product overlay, and build.sh. The
  # studio-server stage builds the IDE door out of this directory.
  "packaging/commonplace-studio/**",
  # Copied beside the fork tree so the built artifact carries the licence.
  "LICENSE",
  # The chat door's web stage copies the console's stylesheets.
  "apps/console/src/styles/**",
  # Every pnpm stage copies all three manifests, not only the two below.
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
# The chat door is the service's public port; the IDE door (:8080, --auth none)
# is reached only through the console's WebSocket-capable /IDE edge proxy on
# the private network, not published separately.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
