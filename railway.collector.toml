# Railway deploy config for the CommonPlace parse-only collector peer.
# Set COLLECTOR_BIND_HOST=0.0.0.0 and COLLECTOR_PORT=${PORT} on this service.

[build]
builder = "RAILPACK"
buildCommand = "npm --prefix collector install --omit=dev"
watchPatterns = [
  "collector/**",
  "railpack.json",
  "railway.collector.toml"
]

[deploy]
startCommand = "npm --prefix collector start"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
