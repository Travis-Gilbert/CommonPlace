name: CommonPlace console CI

# HANDOFF-GREENFIELD-CONSOLE G8: the five gates run and block merge on any
# pull request touching the console app or the extracted contract:
#   1. the import fence (with the probe self-test demonstrating the failure),
#   2. the register lint,
#   3. the contrast gate (markdown-theory WCAG solving over the pinned pairs),
#   4. the motion inventory scan,
#   5. the Noun icon currentColor paint gate,
#   6. the Playwright captures at 1280 and 1440 (the visual baseline).
# The unit suite, typecheck, eslint fence, and production build ride along.

on:
  pull_request:
    paths:
      - "apps/console/**"
      - "apps/console-native/**"
      - "crates/console-core/**"
      - "packages/block-view/**"
      - "packages/console-block/**"
      - "packages/theorem-acp/**"
      - "packages/program-contracts/**"
      - "packages/model-canvas/**"
      - "packages/canvas-substrate/**"
      - "packages/data-model-contracts/**"
      - "packages/okf/**"
      - ".github/workflows/console-ci.yml"

permissions:
  contents: read

env:
  PNPM_FLAGS: "--no-frozen-lockfile"

jobs:
  console-core:
    name: Shared console core, host and wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test deterministic core across native, gpu fallback, and wasm
        run: node crates/console-core/src/sim/prove.mjs

  native-console:
    name: Native console shell
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test native console shell
        run: cargo test --manifest-path apps/console-native/Cargo.toml --locked

  gates:
    name: Gates, unit tests, build
    runs-on: ubuntu-latest
    env:
      THEOREM_REPO_TOKEN: ${{ secrets.THEOREM_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Theorem contract source
        id: theorem-contract-source
        shell: bash
        run: |
          commit="$(
            sed -n 's|^// SOURCE COMMIT: ||p' \
              packages/program-contracts/src/program.generated.ts
          )"
          if [[ ! "$commit" =~ ^[0-9a-f]{9,40}$ ]]; then
            echo "Invalid Theorem source commit: $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Theorem contract source
        if: env.THEOREM_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Travis-Gilbert/Theorem
          ref: ${{ steps.theorem-contract-source.outputs.commit }}
          path: .theorem-contract-source
          persist-credentials: false
          token: ${{ env.THEOREM_REPO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (pnpm)
        run: pnpm install ${{ env.PNPM_FLAGS }}

      - name: Contract package typecheck
        run: pnpm --filter @commonplace/block-view run check

      - name: Program contract package typecheck (PG1)
        run: pnpm --filter @commonplace/program-contracts run check

      - name: Program contracts drift check (PG1)
        if: env.THEOREM_REPO_TOKEN != ''
        run: pnpm --filter @commonplace/program-contracts run check:generated
        env:
          THEOREM_REPO: ${{ github.workspace }}/.theorem-contract-source

      - name: Report unavailable cross-repo drift oracle
        if: env.THEOREM_REPO_TOKEN == ''
        run: |
          echo "::notice::Program contract typechecking passed; Rust regeneration is skipped because THEOREM_REPO_TOKEN is not configured."

      - name: Model canvas / OKF typecheck (MF1)
        run: pnpm --filter @commonplace/okf run check && pnpm --filter @commonplace/model-canvas run check

      # The console design gates only walk apps/console/src, so a package is
      # outside every one of them. Typecheck and test the canvas substrate here
      # explicitly, or the shell both canvases render through goes unchecked.
      - name: Canvas substrate typecheck and tests
        run: |
          pnpm --filter @commonplace/canvas-substrate run check
          pnpm --filter @commonplace/canvas-substrate run test
          pnpm --filter @commonplace/model-canvas run test
          pnpm --filter @commonplace/data-model-contracts run test

      - name: Console block typecheck
        run: pnpm --filter @commonplace/console-block run check

      - name: Console block unit tests
        run: pnpm --filter @commonplace/console-block run test

      - name: ACP package typecheck
        run: pnpm --filter @commonplace/theorem-acp run check

      - name: ACP package unit tests
        run: pnpm --filter @commonplace/theorem-acp run test

      - name: Import fence (gate 1, with probe self-test)
        run: node scripts/check-import-fence.mjs --self-test
        working-directory: apps/console

      - name: Register lint (gate 2)
        run: node scripts/check-register-lint.mjs
        working-directory: apps/console

      - name: Contrast gate (gate 3)
        run: node --experimental-strip-types scripts/check-contrast.mjs
        working-directory: apps/console

      - name: Motion inventory scan (gate 4)
        run: node scripts/check-motion-inventory.mjs
        working-directory: apps/console

      - name: Noun icon paint scan (gate 5, with hostile fill probe)
        run: node scripts/check-icon-svg.mjs
        working-directory: apps/console

      # HANDOFF-CONSOLE-DIMENSIONALITY X2. The register lint checks the form of
      # a value, not its provenance; this checks provenance. A component minting
      # --ij-anything, or a token added to a register without the manifest diff
      # that reviews it, fails here.
      - name: Token manifest gate (gate 7)
        run: node scripts/check-token-manifest.mjs
        working-directory: apps/console

      - name: ESLint (fence in the editor)
        run: pnpm --filter @commonplace/console run lint

      - name: Unit tests
        run: pnpm --filter @commonplace/console run test

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/console

      - name: Production build
        run: pnpm --filter @commonplace/console run build

  visual:
    name: Playwright visual baseline (gate 6)
    # Runs on ubuntu-latest to match the gates job and the repo's CI-captured
    # linux baseline convention: every -linux.png reference (light and dark) is
    # generated from a CI run and pinned, so the gate validates on the same
    # renderer that produced the references. Darwin baselines stay for local mac.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (pnpm)
        run: pnpm install ${{ env.PNPM_FLAGS }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/console

      - name: Run e2e + snapshots
        run: npx playwright test
        working-directory: apps/console

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-results
          path: apps/console/test-results
          retention-days: 7
