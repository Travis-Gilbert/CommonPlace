name: CommonPlace console CI

on:
  pull_request:
    paths:
      - "apps/console/**"
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "railway.toml"
      - ".github/workflows/commonplace-ci.yml"

permissions:
  contents: read

jobs:
  console-quality:
    name: Console lint, tests, and constitutions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @commonplace/console run lint

      - name: Unit tests
        run: pnpm --filter @commonplace/console run test

      - name: Constitution gates
        run: pnpm --filter @commonplace/console run gates

      - name: Build
        run: pnpm --filter @commonplace/console run build

  console-e2e:
    name: Console browser acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @commonplace/console exec playwright install --with-deps chromium

      - name: Run browser acceptance
        run: pnpm --filter @commonplace/console run test:e2e

      - name: Upload traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: commonplace-console-playwright
          path: |
            apps/console/test-results/**
            apps/console/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm --filter @commonplace/desktop run frontend:build
